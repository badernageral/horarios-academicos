; php.ini mínimo para o modo desktop do SGA (PHP portátil no Windows).
; O extension_dir aponta para a pasta "ext" do PHP portátil.
extension_dir = "ext"

; Driver necessário para conectar ao MariaDB/MySQL embutido.
extension = pdo_mysql

; Úteis dependendo do ambiente:
extension = openssl
extension = mbstring

; Timezone (o app também chama date_default_timezone_set).
date.timezone = America/Sao_Paulo

; O servidor embutido é single-thread; deixe o log de erros no stderr
; (capturado pelo orquestrador Electron).
display_errors = Off
log_errors = On
error_log = php://stderr
